<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku Solver</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Sudoku Solver</h1>

        <div class="controls">
            <button id="solve-btn">Solve</button>
            <button id="clear-btn">Clear</button>
            <button id="example-btn">Load Example</button>
            <button id="clipboard-btn">Extract from Clipboard</button>
        </div>

        <div class="status-message" id="status-message"></div>

        <div class="sudoku-container">
            <div class="sudoku-grid" id="sudoku-grid">
                <!-- Grid will be generated by JavaScript -->
            </div>
        </div>

        <div class="instructions">
            <h2>Instructions</h2>
            <p>Enter numbers in the grid above. Leave cells blank for empty positions.</p>
            <p>Use the buttons to: <strong>Solve</strong> the puzzle, <strong>Clear</strong> the grid, or <strong>Load Example</strong> puzzle.</p>
            <p><strong>Extract from Clipboard</strong> imports a Sudoku from a screenshot (requires clipboard permission and a modern browser).</p>
        </div>
    </div>

    <script src="/js/sudoku.js"></script>
</body>
</html>
